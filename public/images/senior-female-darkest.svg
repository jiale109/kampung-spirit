<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -4 24 40" shape-rendering="crispEdges" role="img" aria-labelledby="title desc">
  <title id="title">Senior female avatar — Darkest skin (#603F36)</title>
  <desc id="desc">A senior woman with a silver shoulder-length bob, plum cardigan, skirt, and cane, rendered as a compact front-facing retro pixel sprite.</desc>
